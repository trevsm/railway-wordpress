; Hide PHP version, never show errors to visitors
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

; No remote file inclusion
allow_url_include = Off

; WordPress core does not need to shell out. If a webshell lands, this limits the damage.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,show_source

; Session cookie flags (WordPress does not use PHP sessions, but plugins might)
session.cookie_httponly = 1
session.use_strict_mode = 1
