# ---- Information disclosure ----
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# ---- Security headers ----
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always unset X-Powered-By
</IfModule>

# ---- No directory listings ----
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
</Directory>

# ---- Endpoints that are only useful to bots on this site ----
# xmlrpc.php: brute-force / pingback amplification target
# wp-comments-post.php: comment spam endpoint (comments are disabled)
<Files "xmlrpc.php">
    Require all denied
</Files>
<Files "wp-comments-post.php">
    Require all denied
</Files>

# ---- Files that should never be served ----
# Version/info disclosure and stock config templates
<FilesMatch "^(readme\.html|license\.txt|wp-config-sample\.php|wp-config-docker\.php)$">
    Require all denied
</FilesMatch>
# Dotfiles (.env, .git*, .htpasswd, ...)
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
# Backups, dumps, logs and editor leftovers
<FilesMatch "\.(bak|old|orig|save|swp|sql|log|ini|sh)$">
    Require all denied
</FilesMatch>

# ---- Never execute PHP from uploads (blocks uploaded webshells) ----
<DirectoryMatch "/wp-content/uploads">
    Options -Indexes
    <FilesMatch "\.(php|phtml|phar|php[0-9])$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>
